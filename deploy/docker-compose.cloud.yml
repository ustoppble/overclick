# OverClick cloud instance. Isolated from anything else on the host: own project
# name (COMPOSE_PROJECT_NAME=overclick), own network, own volume, own port.
# Hosted deploys must run ./deploy/deploy.sh so COMPOSE_FILE and the deploy lock
# are applied consistently. This direct command is for diagnostics only.
name: overclick

services:
  overclick-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: overclick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: overclick
    volumes:
      - overclick_pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overclick -d overclick"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [overclick]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      overclick-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://overclick:${POSTGRES_PASSWORD}@overclick-db:5432/overclick
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env (32+ chars)}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      UPDATE_TRIGGER_DIR: /update-trigger
      # OCL-73: tells the update banner/panel this is the hosted project, so
      # they show ./deploy/deploy.sh, never the quickstart's raw compose
      # command (that mismatch is what took the board down in OCL-43).
      OVERCLICK_DEPLOY_MODE: hosted
      # GHSA-hccf: the pairing endpoint charges guesses to the caller's
      # origin, and the only way it learns one is from the proxy in front.
      # Set here because every hosted deploy has one; it requires a proxy
      # that APPENDS the peer to x-forwarded-for (traefik, nginx's
      # $proxy_add_x_forwarded_for, caddy all do) rather than passing a
      # client-supplied header through. Never set it on an instance that
      # takes connections directly: the caller would be naming itself.
      # On by default here; deploy/.env can turn it off.
      OVERCLICK_TRUSTED_PROXY: "${OVERCLICK_TRUSTED_PROXY:-1}"
      # Behind Cloudflare the last hop is Cloudflare's edge, shared by every
      # visitor: name the header it writes the visitor's address into
      # (cf-connecting-ip) and that is the origin instead. Only safe when the
      # server takes traffic from Cloudflare alone; see deploy/README.md.
      OVERCLICK_CLIENT_IP_HEADER: "${OVERCLICK_CLIENT_IP_HEADER:-}"
      # OCL-226: /api/github/release only trusts deliveries signed with this
      # secret (GitHub's X-Hub-Signature-256), and refuses every call while it
      # is empty. Put the same value in each GitHub release webhook.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Sign-in is by a code sent by email only. Both empty = the login screen
      # says it is unavailable; use pnpm emergency-login (deploy/README.md).
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      LOGIN_CODE_MAX_SENDS_PER_HOUR: "${LOGIN_CODE_MAX_SENDS_PER_HOUR:-}"
      # The one origin an emailed link (team invitations) may carry, e.g.
      # https://board.your-domain. Empty = those emails are not sent: the
      # request's Host is attacker-controlled and is never used for a link.
      OVERCLICK_PUBLIC_URL: "${OVERCLICK_PUBLIC_URL:-}"
      # Where `pnpm emergency-login` writes its single-use link file: the
      # tmpfs below, since the root filesystem is read-only. It is mode 0700
      # and in memory, so a link never survives a restart.
      OVERCLICK_EMERGENCY_DIR: /run/emergency
    volumes:
      - update-trigger:/update-trigger
    # Hardening: the image runs as an unprivileged user (uid 10001), so this
    # locks the rest. Nothing in the container can be rewritten, gain a
    # capability or escalate through a setuid binary; only the tmpfs mounts
    # and the update-trigger volume are writable. /tmp is also HOME (pnpm,
    # corepack); Next writes its runtime cache under .next/cache.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
      - /app/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0755
      - /run/emergency:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
    # Bound to loopback: the reverse proxy is the only way in from outside.
    ports:
      - "127.0.0.1:${OVERCLICK_PORT:-3100}:3000"
    networks: [overclick]

  # One-click updater for the hosted deploy (OCL-73). Off by default; enable
  # with:
  #   docker compose -p overclick -f deploy/docker-compose.cloud.yml --profile updater up -d
  #
  # On trigger it runs the exact same ./deploy/deploy.sh a human would run by
  # hand, from inside this container, over the checkout mounted at /workspace
  # and the docker socket: same git pull, same build, same health probe, same
  # legacy-orphan and compose-project guards. It takes the same
  # /tmp/overclick-deploy.lock flock deploy.sh takes (OCL-43) — host /tmp is
  # bind-mounted straight over the container's own, so it is literally the
  # same lock file — so whichever of the two gets there first, a human running
  # deploy.sh on the host or this sidecar answering the UI button, blocks the
  # other out instead of letting two deploys interleave.
  #
  # It needs the docker socket, which is root on the host, which is why it
  # stays behind an explicit profile. Without it Settings shows the command
  # that enables it and the one (./deploy/deploy.sh) that updates by hand.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    profiles: ["updater"]
    working_dir: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - update-trigger:/trigger
      - ..:/workspace
      - /tmp:/tmp
    networks: [overclick]
    entrypoint:
      - /bin/sh
      - -c
      - |
        say() {
          printf '{"phase":"%s","at":"%s","detail":%s}' \
            "$$1" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$${2:-null}" \
            > /trigger/update-status
        }
        # deploy.sh needs bash, git, python3 and curl; this image ships only
        # docker and a busybox shell. Installed once at boot, not per trigger.
        apk add --no-cache bash git python3 curl util-linux >/dev/null 2>&1 || true
        while true; do
          date -u +%Y-%m-%dT%H:%M:%SZ > /trigger/updater-alive
          if [ -f /trigger/update-requested ]; then
            rm -f /trigger/update-requested
            if ! command -v bash >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              say failed "\"updater image is missing bash/git; check its network egress to install them\""
            else
              say pulling
              if bash /workspace/deploy/deploy.sh > /trigger/update-log 2>&1; then
                say done
              else
                say failed "\"$$(tail -c 400 /trigger/update-log | tr -d '\"' | tr '\n' ' ')\""
              fi
            fi
          fi
          sleep 5
        done

volumes:
  overclick_pgdata:
  update-trigger:

networks:
  overclick:
    name: overclick
