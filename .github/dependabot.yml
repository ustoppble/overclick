# Actions are pinned to a full commit SHA, so a moved tag cannot change what
# runs with the release token. Dependabot reads the version comment next to
# each SHA and opens a PR when a newer one exists.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
