# Publishes a versioned image to ghcr.io on every v* tag push. This powers the
# opt-in self-update flow: instances that enable the update check compare their
# version against the latest GitHub Release and pull this image.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag never diverges from the manifests it publishes: OCL-73 turned
      # yesterday's incident (a tag pushed without a version bump, so the
      # deployed instance's own APP_VERSION read as older than the release it
      # already ran) into a release-time failure instead of a runtime banner.
      - run: scripts/verify-release-version.sh

  publish:
    needs: [verify, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # OCL-158: the Release is what the update check reads. `checkForUpdate` in
  # apps/web/src/lib/updates.ts asks GitHub for the LATEST RELEASE and compares
  # it against the running version — a published image alone is invisible to
  # it. This step used to be a human remembering; on 2026-08-31 v0.3.2 and
  # v0.3.3 both shipped images with no Release, and the hosted instance sat on
  # v0.3.1 for two versions without ever showing a banner. It runs after the
  # image so a Release never announces a version nobody can pull.
  release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: notes
        # The body of the release commit is the changelog, written once by
        # scripts/release.sh. `%b` is the body alone, without the subject.
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            git log -1 --pretty=%b "${GITHUB_REF_NAME}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "OverClick ${GITHUB_REF_NAME#v}" \
            --notes "${{ steps.notes.outputs.body }}"
