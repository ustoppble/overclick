# Publishes a versioned image to ghcr.io on every v* tag push. This powers the
# opt-in self-update flow: instances that enable the update check compare their
# version against the latest GitHub Release and pull this image.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The tag never diverges from the manifests it publishes: OCL-73 turned
      # yesterday's incident (a tag pushed without a version bump, so the
      # deployed instance's own APP_VERSION read as older than the release it
      # already ran) into a release-time failure instead of a runtime banner.
      - run: scripts/verify-release-version.sh

  publish:
    needs: [verify, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # OCL-158: the Release is what the update check reads. `checkForUpdate` in
  # apps/web/src/lib/updates.ts asks GitHub for the LATEST RELEASE and compares
  # it against the running version — a published image alone is invisible to
  # it. This step used to be a human remembering; on 2026-08-31 v0.3.2 and
  # v0.3.3 both shipped images with no Release, and the hosted instance sat on
  # v0.3.1 for two versions without ever showing a banner. It runs after the
  # image so a Release never announces a version nobody can pull.
  release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The body of the release commit is the changelog, written once by
      # scripts/release.sh. `%b` is the body alone, without the subject.
      #
      # OCL-207: the notes go from git to a file and from the file to gh, and
      # never through a `${{ }}` expression. Expressions are expanded into the
      # script text before bash runs it, so the old
      # `--notes "${{ steps.notes.outputs.body }}"` pasted the changelog into
      # the script itself: every backtick ran as command substitution on a
      # runner holding GH_TOKEN, and every double quote ended the argument.
      # v0.3.19 got a Release with each backticked word erased; v0.3.20 got
      # none. A file is inert data, and it also drops the step output's
      # heredoc delimiter, which a changelog line could have closed early.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          git log -1 --pretty=%b "${GITHUB_REF_NAME}" > "$notes"
          gh release create "${GITHUB_REF_NAME}" \
            --title "OverClick ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes"
